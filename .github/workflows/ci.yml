name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          # Verify against both the published checksums file and the value pinned above.
          grep " ${asset}\$" checksums.txt | sha256sum --check --strict
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum --check --strict
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks (full history)
        run: gitleaks git --no-banner --redact --config .gitleaks.toml .

      - name: Denylist scan (tracked files + full history)
        env:
          AILAB_DENYLIST: ${{ secrets.AILAB_DENYLIST }}
          # Fork PRs cannot read secrets; only they may skip the private patterns.
          AILAB_DENYLIST_OPTIONAL: ${{ github.event.pull_request.head.repo.fork == true && '1' || '0' }}
        run: scripts/denylist_scan.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Run eval (fails below the thresholds in eval_config.toml)
        # ailab-eval appends its results table to $GITHUB_STEP_SUMMARY.
        run: uv run --no-sync ailab-eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval_results.json
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GIT_COMMIT="${GITHUB_SHA::7}" -t ailab-prompting:ci .
      - name: Run image as a smoke test (demo + eval gate)
        run: docker run --rm ailab-prompting:ci
      - name: Assert the container runs as non-root
        run: test "$(docker run --rm ailab-prompting:ci id -u)" != "0"
