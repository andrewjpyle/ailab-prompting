[project]
name = "ailab-prompting"
version = "0.1.0"
description = "A small, eval-gated, local-only prompt-engineering lab (strategies + injection defense)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Pyle" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ailab-eval = "ailab_prompting.eval:main"
ailab-demo = "ailab_prompting.demo:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ailab_prompting"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["ailab_prompting"]
omit = ["*/ailab_prompting/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
